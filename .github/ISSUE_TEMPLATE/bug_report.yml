name: 🐛 Bug report
description: Submit a detailed bug report to help investigate and resolve the issue with this package.
title: '[BUG] '
labels: ['bug']
assignees: ['nhankyjangchan']
body:
    - type: markdown
      id: bug_report-header-before-info
      attributes:
          value: ⚠️ **Before filling this form**, please ensure you've read the [documentation](https://github.com/nhankyjangchan/dumpling) and searched for [existing issues](https://github.com/nhankyjangchan/dumpling/issues).

    - type: markdown
      id: bug_report-header-security-info
      attributes:
          value: 🔒 If you believe you've found a **security vulnerability**, **DO NOT** report it through public GitHub issues, discussions, pull requests, or any other public channel. Doing so exposes the vulnerability to potential attackers before a fix can be prepared and released, endangering all users who depend on this package. Instead, please review the project's **[Security Policy](https://github.com/nhankyjangchan/dumpling/security/policy)** for details.

    - type: textarea
      id: bug_description
      attributes:
          label: Describe the bug
          description: A clear and concise description of what the bug is.
          placeholder: ...
      validations:
          required: true

    - type: textarea
      id: bug_reproduction-steps
      attributes:
          label: Steps to reproduce
          description: How to reproduce the behavior.
          placeholder: |
              1. ...
              2. ...
              3. ...
      validations:
          required: true

    - type: textarea
      id: bug_reproduction-code
      attributes:
          label: Minimal reproduction code
          description: Please provide a minimal code snippet that reproduces the issue.
          render: javascript
          placeholder: //...
      validations:
          required: false

    - type: textarea
      id: package_expected-behavior
      attributes:
          label: Expected behavior
          description: A clear and concise description of what you expected to happen.
          placeholder: ...
      validations:
          required: true

    - type: dropdown
      id: environment_package-version
      attributes:
          label: Package version
          description: Please specify the package version where the bug was found.
          multiple: false
          options:
              - v0.1.x
          default: 0
      validations:
          required: true

    - type: input
      id: environment_runtime
      attributes:
          label: Runtime type and version
          description: Please indicate the type and version of the runtime on which you encountered the bug.
          placeholder: Bun v1.4.2
      validations:
          required: true

    - type: input
      id: environment_os
      attributes:
          label: OS type and version
          description: Please indicate the type and version of the OS on which you encountered the bug.
          placeholder: GNU/Linux Debian 13
      validations:
          required: true

    - type: textarea
      id: bug_context
      attributes:
          label: Additional context
          description: Add any other context about the problem here.
          placeholder: Paste error logs or cURL commands here...
      validations:
          required: false

    - type: markdown
      id: bug_report-footer
      attributes:
          value: 💙 Thanks for helping improve this package!
